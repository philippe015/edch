name: EDCH Cyberpunk Philou — Compat BKNadir v1.6.15

on:
  push:
    branches:
      - 'feat/synchronisation-bknadir-controles-missions-v1.6.15-*'
  pull_request:
    paths:
      - 'public/data/binds.json'
      - 'tools/gen_binds.py'
      - 'tools/sources/edrefcard/**'
      - 'src/game/activity/missions.ts'
      - 'test/massacre.test.mjs'
      - 'test/upstream-sync-v1615.test.mjs'
      - '.github/workflows/edch-upstream-v1615.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edch-upstream-v1615-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-test-and-generator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Build TypeScript
        run: npm run build
      - name: Full JavaScript regressions
        run: node --test test/*.test.mjs
      - name: Regenerate EDRefCard2 catalog and check reproducibility
        run: |
          python3 tools/gen_binds.py
          git diff --exit-code -- public/data/binds.json

  native-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux requirements for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Tauri frontend
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
