name: EDCH Cyberpunk Philou - Profils commandes v1.6.12
on:
  push:
    branches:
      - 'feat/elite-commandes-profils-prepares-v1.6.12-*'
  pull_request:
    paths:
      - 'src/views/controls/**'
      - 'src/features/controls/**'
      - 'src-tauri/src/controls_preset.rs'
      - 'public/elite-prepared-profiles.css'
      - 'public/index.html'
      - 'test/elite-prepared-profiles-v1612.test.mjs'
      - '.github/workflows/edch-controls-v1612.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edch-controls-v1612-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Compile frontend
        run: npm run build
      - name: All JavaScript regression tests
        run: node --test test/*.test.mjs

  rust-odyssey-binds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Tauri frontend
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Native unit tests and .binds safety checks
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Native compile checks
        run: cargo check --manifest-path src-tauri/Cargo.toml
