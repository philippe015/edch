name: EDCH — Commandes 3 onglets et profils v1.6.10

on:
  push:
    branches:
      - 'feat/commandes-3-onglets-*'
  pull_request:
    paths:
      - 'src/views/controls/**'
      - 'src/features/controls/**'
      - 'public/controls-pro.css'
      - 'test/controls-*.test.mjs'
      - 'test/foot-*.test.mjs'
      - '.github/workflows/edch-commandes-multiperi-v1610.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edch-commandes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install without an upstream lockfile
        run: npm install --no-package-lock
      - name: Build strict TypeScript frontend
        run: npm run build
      - name: Test all controls and AZERTY profiles
        run: node --test test/controls-*.test.mjs test/foot-*.test.mjs
      - name: Full JavaScript regression
        run: node --test test/*.test.mjs

  rust-preset-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and prepare frontend
        run: |
          npm install --no-package-lock
          npm run build
      - name: Verify .binds writers and other Rust regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust compiler check
        run: cargo check --manifest-path src-tauri/Cargo.toml
