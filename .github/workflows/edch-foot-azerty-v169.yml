name: EDCH — Commandes à pied AZERTY v1.6.9

on:
  push:
    branches:
      - 'feat/commandes-au-sol-*'
  pull_request:
    paths:
      - 'src/features/controls/footProfiles.ts'
      - 'src/features/controls/footEdit.ts'
      - 'src/views/controls/footEditor.ts'
      - 'test/foot-*.test.mjs'
      - 'src-tauri/src/foot_binds.rs'
      - '.github/workflows/edch-foot-azerty-v169.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edch-foot-azerty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-and-foot-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no upstream package-lock)
        run: npm install --no-package-lock
      - name: Compile the TypeScript project
        run: npm run build
      - name: AZERTY, input capture and existing foot editor tests
        run: node --test test/foot-*.test.mjs
      - name: Full JavaScript regression suite
        run: node --test test/*.test.mjs

  rust-foot-binds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri/Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-package-lock
      - name: Prepare frontend dist for Tauri
        run: npm run build
      - name: Verify safe Odyssey binding writer
        run: cargo test --manifest-path src-tauri/Cargo.toml foot_binds::tests
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
