name: EDCH Cyberpunk Philou — Xbox intelligent v1.6.14

on:
  push:
    branches:
      - 'feat/manette-xbox-graphique-profils-intelligents-v1.6.14-*'
  pull_request:
    paths:
      - 'src/features/controls/xboxIntelligentProfiles.ts'
      - 'src/views/controls/xboxControllerDiagram.ts'
      - 'src/views/controls/presetEditor.ts'
      - 'public/xbox-controller-v1614.css'
      - 'public/index.html'
      - 'test/xbox-graphique-profiles-v1614.test.mjs'
      - '.github/workflows/edch-xbox-v1614.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edch-xbox-v1614-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript compile
        run: npm run build
      - name: Full JavaScript test suite
        run: node --test test/*.test.mjs

  rust-profile-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux Tauri requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build required Tauri frontend
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Native tests including safe bindings writer
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Native compilation check
        run: cargo check --manifest-path src-tauri/Cargo.toml
