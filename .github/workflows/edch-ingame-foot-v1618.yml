name: EDCH Cyberpunk Philou - Odyssey in-game controls v1.6.18
on:
  push:
    branches:
      - 'feat/odyssey-commandes-configurables-jeu-v1.6.18-*'
  pull_request:
    paths:
      - 'src/features/controls/inGameOnFoot.ts'
      - 'src/views/controls/presetEditor.ts'
      - 'public/odyssey-ingame-foot-v1618.css'
      - 'public/index.html'
      - 'test/odyssey-ingame-activation-v1618.test.mjs'
      - '.github/workflows/edch-ingame-foot-v1618.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edch-ingame-foot-v1618-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: All frontend regression tests
        run: node --test test/*.test.mjs
  native-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Native presets tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Native compilation checks
        run: cargo check --manifest-path src-tauri/Cargo.toml
