name: EDCH Cyberpunk Philou — Profils nommés Odyssey v1.6.21

on:
  push:
    branches:
      - 'feat/profils-nommes-complets-odyssey-v1.6.21-*'
  pull_request:
    paths:
      - 'src/features/controls/namedPresets.ts'
      - 'src/features/controls/completeFootPresets.ts'
      - 'src/views/controls/presetEditor.ts'
      - 'src/platform/bridge.ts'
      - 'src-tauri/src/controls_preset.rs'
      - 'src-tauri/src/lib.rs'
      - 'public/named-odyssey-v1621.css'
      - 'public/index.html'
      - 'test/named-complete-odyssey-v1621.test.mjs'
      - '.github/workflows/edch-named-odyssey-v1621.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edch-named-odyssey-v1621-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Build TypeScript
        run: npm run build
      - name: Full JavaScript regression suite
        run: node --test test/*.test.mjs
  rust-named-presets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native Linux/Tauri requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Native tests and safe backup checks
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml
