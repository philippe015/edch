name: EDCH Cyberpunk Philou — Capture P/S à pied v1.6.19

on:
  push:
    branches:
      - 'feat/capture-touches-directe-p-s-v1.6.19-*'
  pull_request:
    paths:
      - 'src/features/controls/footDirectCapture.ts'
      - 'src/features/controls/presetAdvisor.ts'
      - 'src/views/controls/presetEditor.ts'
      - 'src-tauri/src/controls_preset.rs'
      - 'public/foot-direct-capture-v1619.css'
      - 'test/foot-direct-capture-v1619.test.mjs'
      - '.github/workflows/edch-foot-direct-capture-v1619.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edch-foot-capture-v1619-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Compile TypeScript
        run: npm run build
      - name: Run entire JS suite
        run: node --test test/*.test.mjs

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri/Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend for Rust validation
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Rust tests for .binds writer
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust compile checks
        run: cargo check --manifest-path src-tauri/Cargo.toml
