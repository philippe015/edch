[package]
name = "edch"
version = "0.10.11"
description = "Elite Dangerous companion: materials, engineering and where to find them"
authors = ["BKNadir"]
edition = "2021"
license = "MIT"

[lib]
name = "edch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
arboard = { version = "3", default-features = false }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

# Windows only: the process list for "is the game running?" (no tasklist.exe).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
